name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to run: local, saucelabs or browserstack'
        required: true
        default: local
      browser:
        description: 'Browser (local target only): chrome or firefox'
        required: false
        default: chrome

jobs:
  # Runs on every push/PR: the suite on the GitHub runner itself (target=local), no secrets needed.
  local:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Chrome and Firefox are pre-installed on the runner; Selenium Manager fetches matching drivers.
      - name: Run suite (local, ${{ matrix.browser }})
        run: mvn -B test -Dtarget=local -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-local-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Manual only: cross-browser run on a cloud provider. Add the matching repo secrets first.
  cloud:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run cross-browser suite on ${{ github.event.inputs.target }}
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BUILD_NAME: "cloud-execution ${{ github.run_number }}"
        run: >
          mvn -B test
          -Dtarget=${{ github.event.inputs.target }}
          -Dsurefire.suiteXmlFiles=src/test/resources/suites/cross-browser.xml
      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.event.inputs.target }}
          path: target/surefire-reports/
          if-no-files-found: ignore

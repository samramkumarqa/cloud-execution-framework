# Defaults only. Override with -Dkey=value or an environment variable (target -> TARGET, grid.url -> GRID_URL).

# Where the suite runs: local | grid | saucelabs | browserstack
target=local

# Application under test
ui.base.url=https://www.saucedemo.com

# Local browser
browser=chrome
headless=true

# grid target: a remote Selenium hub (AWS EC2 Grid, Google Cloud Grid/Zalenium, Docker, ...)
# grid.url=http://my-grid-host:4444/wd/hub

# Cloud credentials come from the environment / CI secrets. Never put real keys in this file.
#   Sauce Labs:    SAUCE_USERNAME, SAUCE_ACCESS_KEY   (optional SAUCE_REGION, default eu-central-1)
#   BrowserStack:  BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY
